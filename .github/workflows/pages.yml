name: Website on GitHub Pages

# Builds the Nuxt website as static files and publishes it to GitHub Pages.
# GitHub Pages can only host the website. The API and database run elsewhere
# (Render, see render.yaml). Set the API address in the repository variable
# API_BASE, for example https://iwear-api.onrender.com/api

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build static website
        run: npm run generate -w @iwear/web
        env:
          STATIC_SITE: '1'
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_API_BASE: ${{ vars.API_BASE || 'http://localhost:3001/api' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
