# Local services for development: PostgreSQL (main database) and Redis (job queue, used from phase 5).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iwear
      POSTGRES_PASSWORD: iwear
      POSTGRES_DB: iwear
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
